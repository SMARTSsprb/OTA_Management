name: Build ESP32-C3 OTA Firmware

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      manikin_id:
        description: 'Manikin ID (e.g. 103, 101, 106)'
        required: false
        default: '103'

jobs:
  build:
    name: Build & Package ESP32-C3 Firmware
    runs-on: ubuntu-latest
    container: espressif/idf:release-v5.3
    steps:
      - name: Git Safe Directory
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
        shell: bash

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set Manikin ID
        shell: bash
        run: |
          MANIKIN_ID="${{ github.event.inputs.manikin_id || '103' }}"
          echo "Building firmware for Manikin ID: Manikin_${MANIKIN_ID}"
          sed -i "s/#define CONFIG_CPR_MANIKIN_ID .*/#define CONFIG_CPR_MANIKIN_ID \"${MANIKIN_ID}\"/g" OTA_FIrmware/main/main.c

      - name: Build and Package with ESP-IDF
        shell: bash
        run: |
          . /opt/esp/idf/export.sh
          echo "=== 1. Building OTA Maintenance Firmware (ota_0) ==="
          cd "$GITHUB_WORKSPACE/OTA_FIrmware"
          idf.py set-target esp32c3
          idf.py build
          cd build
          esptool.py --chip esp32c3 merge_bin -o allreal_cpr_ota_merged_0x0.bin @flash_args
          ls -lh allreal_cpr_ota_merged_0x0.bin

          echo "=== 2. Building CPR Training Application (ota_1) ==="
          cd "$GITHUB_WORKSPACE/CPR_App"
          idf.py set-target esp32c3
          idf.py build
          ls -lh build/cpr_app.bin

      - name: Upload Firmware Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: CPR_OTA_Firmware_ESP32C3
          path: |
            OTA_FIrmware/build/bootloader/bootloader.bin
            OTA_FIrmware/build/partition_table/partition-table.bin
            OTA_FIrmware/build/ota_data_initial.bin
            OTA_FIrmware/build/allreal_cpr_ota.bin
            OTA_FIrmware/build/allreal_cpr_ota_merged_0x0.bin
            CPR_App/build/cpr_app.bin
          if-no-files-found: error
